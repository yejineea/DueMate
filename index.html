<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DueMate — 대학생 과제·일정 관리</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🍅 DueMate</h1>
    <nav id="tabs">
      <button data-tab="pomodoro" class="active">뽀모도로</button>
      <button data-tab="todo">To Do</button>
      <button data-tab="report">리포트</button>
      <button data-tab="achieve">토마토 키우기</button>
      <button data-tab="settings">설정</button>
    </nav>
    <button id="pomo-chip" class="pomo-chip" data-tab="pomodoro" title="뽀모도로 탭에서 타이머 보기" hidden></button>
    <button class="btn primary" data-action="new-task">+ 과제 추가</button>
  </header>

  <main id="view"></main>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/utils.js"></script>
  <script src="js/estimate.js"></script>
  <script src="js/store.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
