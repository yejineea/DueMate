<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DueMate — 대학생 과제·일정 관리</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📚 DueMate</h1>
    <nav id="tabs">
      <button data-tab="dashboard" class="active">대시보드</button>
      <button data-tab="tasks">과제</button>
      <button data-tab="calendar">캘린더</button>
      <button data-tab="stats">통계</button>
      <button data-tab="grades">성적</button>
      <button data-tab="settings">설정</button>
    </nav>
    <button class="btn primary" data-action="new-task">+ 과제 추가</button>
  </header>

  <main id="view"></main>

  <div id="timerbar" class="timerbar hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
