<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DueMate 테스트</title>
  <style>
    body { font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
    #summary { font-size: 18px; font-weight: 700; }
    li { margin: 4px 0; font-size: 14px; }
    li.pass { color: #2f7d4a; } li.fail { color: #c0262d; font-weight: 700; }
    h2 { font-size: 15px; margin: 18px 0 6px; }
  </style>
</head>
<body>
  <h1>DueMate 브라우저 테스트</h1>
  <p class="muted">핵심 계산 로직을 실제 브라우저에서 검증합니다. 테스트는 메모리 상태만 사용하며 저장된 데이터를 바꾸지 않습니다.</p>
  <p id="summary">실행 중...</p>
  <div id="results"></div>
  <!-- 실제 앱 화면 구조: 클릭 테스트에 사용 (보이지 않게 숨김) -->
  <div id="app-under-test" hidden>
    <header class="topbar"><h1>DueMate</h1>
      <button id="pomo-chip" class="pomo-chip" data-tab="pomodoro" hidden></button>
      <nav id="tabs"><button data-tab="pomodoro">뽀모도로</button><button data-tab="todo">ToDo</button><button data-tab="report">리포트</button><button data-tab="achieve">토마토 키우기</button><button data-tab="settings">설정</button></nav>
    </header>
    <main id="view"></main>
    <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
    <div id="toast"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/estimate.js"></script>
  <!-- 저장된 데이터가 있는 브라우저를 흉내 낸다: store.js가 로드되는 동안만 읽기를 가짜로 바꾼다 (실제 저장소는 건드리지 않음) -->
  <script>
    window.__realGetItem = Storage.prototype.getItem;
    Storage.prototype.getItem = function (key) {
      if (key !== 'duemate-v1') return window.__realGetItem.call(this, key);
      return JSON.stringify({
        tasks: [
          { id: 'saved1', title: '저장된 완료 과제', subject: '과목', type: '코딩', due: '2026-10-20T23:59', estHours: 2, importance: 3, difficulty: 3,
            subtasks: [], logs: [{ date: '2026-10-19', ms: 10800000, pomo: 1 }], done: true, doneAt: 1760000000000 },
          { id: 'saved2', title: '저장된 자동 추정 과제', subject: '과목', type: '코딩', due: '2099-01-01T23:59', estHours: 5, importance: 3, difficulty: 3,
            subtasks: [], logs: [], done: false, doneAt: null, estAuto: true },
        ],
        subjects: ['과목'], schedule: [], grades: {}, timer: null, settings: {},
      });
    };
  </script>
  <script src="js/store.js"></script>
  <script>Storage.prototype.getItem = window.__realGetItem; window.__loadedState = state;</script>
  <script>save = function () {}; // 테스트는 저장소를 건드리지 않는다</script>
  <script src="js/availability.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
